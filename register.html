<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Started with VALENCE | Start Free Bookkeeping Trial</title>
  <meta name="description" content="Create your account and get one month of free bookkeeping and fractional CFO review with VALENCE.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #F0F4F2 0%, #E6EFEA 100%);
      padding: 3.5rem 1rem 2.5rem;
      margin: 0;
      position: relative;
    }
    .auth-card-clean {
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid var(--bench-border);
      box-shadow: 0 20px 50px rgba(17, 42, 61, 0.12);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 500px;
      margin: auto;
      text-align: center;
    }
    .divider-text {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--bench-slate);
      font-size: 0.8rem;
      font-weight: 600;
    }
    .divider-text::before,
    .divider-text::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--bench-border);
    }
    .divider-text::before { margin-right: 0.75rem; }
    .divider-text::after { margin-left: 0.75rem; }
  </style>
</head>
<body>

  <!-- Quick Toggles Outside Container -->
  <div class="auth-top-controls">
    <button type="button" class="quick-toggle-btn rtl-toggle-btn" title="Toggle RTL / LTR Layout" aria-label="Toggle RTL">
      <i data-lucide="arrow-left-right" style="width: 16px; height: 16px;"></i>
    </button>
    <button type="button" class="quick-toggle-btn theme-toggle-btn" title="Toggle Dark Black Theme" aria-label="Toggle Theme">
      <i data-lucide="moon" style="width: 16px; height: 16px;"></i>
    </button>
  </div>

  <div class="auth-card-clean">
    
    <!-- Centered Brand Logo -->
    <div class="text-center mb-3">
      <a href="index.html" class="brand-logo-bench d-inline-flex flex-column align-items-center text-decoration-none">
        <div class="brand-logo-main" style="font-size: 1.85rem;">
          VALENCE<span style="font-size: 0.95rem; vertical-align: super; font-weight: 700;">®</span>
        </div>
        <div class="brand-logo-sub" style="font-size: 0.68rem; letter-spacing: 0.16em;">MAINSTREET</div>
      </a>
    </div>

    <!-- Centered Heading & Subtitle -->
    <div class="mb-4 text-center">
      <div class="badge bg-bench-green-subtle text-bench-green px-3 py-1 rounded-pill fw-bold mb-2">1 MONTH FREE TRIAL</div>
      <h1 style="font-size: 1.75rem; color: var(--bench-navy); margin-bottom: 0.35rem; font-weight: 800;">Start your free trial</h1>
      <p style="color: var(--bench-slate); font-size: 0.92rem; margin: 0;">
        No credit card required. Get paired with a dedicated bookkeeper today.
      </p>
    </div>

    <!-- SSO Buttons (Google, Microsoft, Apple) -->
    <div class="d-flex flex-column gap-2 mb-3">
      <a href="dashboard.html" class="btn-sso m-0">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Sign up with Google Workspace
      </a>

      <a href="dashboard.html" class="btn-sso m-0">
        <svg width="18" height="18" viewBox="0 0 23 23"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
        Sign up with Microsoft 365
      </a>

      <a href="dashboard.html" class="btn-sso m-0">
        <svg class="apple-logo-icon" width="18" height="18" viewBox="0 0 170 170"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.69-7.85-11.96-14.43-6.96-10.76-12.28-23.48-15.96-38.16-3.68-14.67-5.52-27.91-5.52-39.71 0-14.79 3.5-27.12 10.51-37 7.01-9.89 16.14-14.97 27.39-15.26 4.79 0 10.15 1.25 16.08 3.76 5.93 2.51 9.77 3.82 11.53 3.93 1.95 0 6.04-1.42 12.26-4.25 6.22-2.83 11.89-4.14 17.02-3.93 12.82.76 23.01 5.44 30.56 14.04-10.86 6.53-16.19 15.56-16 27.1.2 9.35 3.91 17.2 11.12 23.54 7.21 6.34 15.77 9.94 25.68 10.8-2.61 7.84-5.98 16.22-10.12 25.13zM119.22 31.02c0-7.39 2.61-14.19 7.83-20.4 5.22-6.21 11.75-10.02 19.59-11.42.43 1.3.65 2.5.65 3.59 0 7.39-2.72 14.46-8.16 21.21-5.43 6.74-12.07 10.66-19.91 11.75-.43-1.52-.65-3.09-.65-4.73z"/></svg>
        Sign up with Apple
      </a>
    </div>

    <div class="divider-text">OR REGISTER WITH WORK EMAIL</div>

    <!-- Registration Form (Stacked Inputs One by One) -->
    <form id="registerForm" class="text-start" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="mb-3">
        <label class="form-label fw-bold" style="font-size: 0.85rem; color: var(--bench-navy);">Full Name</label>
        <input type="text" class="form-control" placeholder="Alex Sterling" required style="padding: 0.75rem 1rem; border-radius: 8px; border-color: var(--bench-border);">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold" style="font-size: 0.85rem; color: var(--bench-navy);">Company Name</label>
        <input type="text" class="form-control" placeholder="Vanguard Dynamics" required style="padding: 0.75rem 1rem; border-radius: 8px; border-color: var(--bench-border);">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold" style="font-size: 0.85rem; color: var(--bench-navy);">Work Email</label>
        <input type="email" class="form-control" placeholder="alex@company.com" required style="padding: 0.75rem 1rem; border-radius: 8px; border-color: var(--bench-border);">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold" style="font-size: 0.85rem; color: var(--bench-navy);">Password</label>
        <div class="password-field-wrapper">
          <input type="password" class="form-control" placeholder="Minimum 8 characters" required style="padding: 0.75rem 1rem; border-radius: 8px; border-color: var(--bench-border);">
          <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
            <i data-lucide="eye" style="width: 17px; height: 17px;"></i>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold" style="font-size: 0.85rem; color: var(--bench-navy);">Annual Revenue Range</label>
        <select class="form-select" style="padding: 0.75rem 1rem; border-radius: 8px; border-color: var(--bench-border);">
          <option value="early">Under $250K ARR</option>
          <option value="growth" selected>$250K – $1.5M ARR</option>
          <option value="scale">$1.5M – $10M+ ARR</option>
        </select>
      </div>

      <!-- Terms and Conditions Checkbox -->
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="agreeTerms" required style="cursor: pointer;">
        <label class="form-check-label" for="agreeTerms" style="font-size: 0.85rem; color: var(--bench-slate); cursor: pointer;">
          I agree to the <a href="#" class="text-bench-green text-decoration-none fw-semibold">Terms of Service</a> and <a href="#" class="text-bench-green text-decoration-none fw-semibold">Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="btn-bench-primary w-100" style="padding: 0.85rem; font-size: 1rem;">
        Create Account & Access Portal <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
      </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center" style="font-size: 0.875rem; color: var(--bench-slate);">
      Already have an account? 
      <a href="login.html" style="color: var(--bench-green); font-weight: 700; text-decoration: none; margin-left: 0.25rem;">
        Log in instead
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/main.js"></script>
</body>
</html>
