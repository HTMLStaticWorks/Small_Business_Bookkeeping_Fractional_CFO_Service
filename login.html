<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to VALENCE | Online Bookkeeping & CFO Portal</title>
  <meta name="description" content="Securely log in to your VALENCE client portal and access your real-time financial control room.">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #F0F4F2 0%, #E6EFEA 100%);
      padding: 2rem 1rem;
      margin: 0;
    }
    .auth-card-clean {
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid var(--bench-border);
      box-shadow: 0 20px 50px rgba(17, 42, 61, 0.12);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 480px;
      margin: auto;
      text-align: center;
    }
    .btn-sso {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--bench-border);
      border-radius: 8px;
      background: #ffffff;
      color: var(--bench-navy);
      font-weight: 600;
      font-size: 0.9rem;
      transition: var(--transition);
      text-decoration: none;
      margin-bottom: 0.75rem;
    }
    .btn-sso:hover {
      background: var(--bench-bg-light);
      border-color: var(--bench-navy);
      color: var(--bench-navy);
    }
    .divider-text {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--bench-slate);
      font-size: 0.8rem;
      font-weight: 600;
    }
    .divider-text::before,
    .divider-text::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--bench-border);
    }
    .divider-text::before { margin-right: 0.75rem; }
    .divider-text::after { margin-left: 0.75rem; }
  </style>
</head>
<body>

  <div class="auth-card-clean position-relative">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <!-- Clickable Logo linking to Home -->
      <a href="index.html" class="brand-logo-bench d-inline-flex align-items-start text-decoration-none text-start">
        <div class="brand-logo-main" style="font-size: 1.6rem;">
          VALENCE<span style="font-size: 0.9rem; vertical-align: super; font-weight: 700;">®</span>
        </div>
        <div class="brand-logo-sub" style="font-size: 0.65rem;">CLIENT PORTAL</div>
      </a>
      
      <!-- Quick Toggles -->
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="quick-toggle-btn rtl-toggle-btn" title="Toggle RTL / LTR Layout" aria-label="Toggle RTL" style="width: 34px; height: 34px;">
          <i data-lucide="arrow-left-right" style="width: 15px; height: 15px;"></i>
        </button>
        <button type="button" class="quick-toggle-btn theme-toggle-btn" title="Toggle Dark Black Theme" aria-label="Toggle Theme" style="width: 34px; height: 34px;">
          <i data-lucide="moon" style="width: 15px; height: 15px;"></i>
        </button>
      </div>
    </div>

    <div class="mb-4 text-start">
      <h1 style="font-size: 1.75rem; color: var(--bench-navy); margin-bottom: 0.4rem; font-weight: 800;">Log in to your account</h1>
      <p style="color: var(--bench-slate); font-size: 0.92rem; margin: 0;">
        Access your real-time books and financial dashboard.
      </p>
    </div>

    <!-- SSO Buttons -->
    <a href="dashboard.html" class="btn-sso">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Sign in with Google Workspace
    </a>

    <a href="dashboard.html" class="btn-sso">
      <svg width="18" height="18" viewBox="0 0 23 23"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
      Sign in with Microsoft 365
    </a>

    <div class="divider-text">OR WITH EMAIL</div>

    <!-- Login Form -->
    <form id="loginForm" class="text-start" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="mb-3">
        <label class="form-label fw-bold" style="font-size: 0.85rem; color: var(--bench-navy);">Work Email</label>
        <input type="email" class="form-control" placeholder="name@company.com" value="alex@vanguard.io" required style="padding: 0.75rem 1rem; border-radius: 8px; border-color: var(--bench-border);">
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label fw-bold mb-0" style="font-size: 0.85rem; color: var(--bench-navy);">Password</label>
          <a href="#" style="font-size: 0.8rem; color: var(--bench-green); text-decoration: none; font-weight: 600;">Forgot?</a>
        </div>
        <input type="password" class="form-control" value="••••••••••••" required style="padding: 0.75rem 1rem; border-radius: 8px; border-color: var(--bench-border);">
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="rememberMe" checked style="cursor: pointer;">
        <label class="form-check-label" for="rememberMe" style="font-size: 0.85rem; color: var(--bench-slate); cursor: pointer;">
          Remember this device for 30 days
        </label>
      </div>

      <button type="submit" class="btn-bench-primary w-100" style="padding: 0.85rem; font-size: 1rem;">
        Log in to Portal <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
      </button>
    </form>

    <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center" style="font-size: 0.875rem;">
      <a href="index.html" style="color: var(--bench-slate); text-decoration: none; display: inline-flex; align-items: center; gap: 0.35rem;">
        <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i> Back to Home
      </a>
      <a href="register.html" style="color: var(--bench-green); font-weight: 700; text-decoration: none;">
        Create Account
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/main.js"></script>
</body>
</html>
